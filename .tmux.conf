set-environment -g PATH "$HOME/.local/bin:$PATH"
set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0

# Prefix
unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix

# ── Ayu Dark Status Bar ──────────────────────────────
set -g status-style "bg=#0a0e14,fg=#b3b1ad"

# Left (Flat + Padded)
set -g status-left-length 200
set -g status-left "  #[fg=#e6b450,bold]⌘ #S#[fg=#b3b1ad,nobold]  "

# Right (Flat + Padded)
set -g status-right-length 150
set -g status-right "  #[fg=#7fd962] #(cd #{pane_current_path} 2>/dev/null && git branch --show-current 2>/dev/null) #[fg=#d2a6ff]#{?SSH_CONNECTION,SSH ,}#[fg=#b3b1ad]  "

# ── Window Tabs ──────────────────────────────────────
set -g window-status-style "bg=default,fg=#5c6773"
set -g window-status-current-style "bg=default,fg=#e6b450,bold"

set -g window-status-format "  #I:#W  "
set -g window-status-current-format "  #I:#W  "

# ── Status Bar Options ───────────────────────────────
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g status-justify centre

set-option -g default-shell /bin/zsh
set-option -g default-command /bin/zsh

# Reload
bind r source-file ~/.tmux.conf
set -g base-index 1

# Copy mode (vim)
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Pane navigation (vim brain)
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

set -g popup-border-style "fg=#e6b450"
set -g popup-style "bg=#0a0e14"
# Sessionizer
bind-key -r f display-popup -E \
  -w 70% -h 80% \
  -x C -y C \
  "~/.local/bin/tmux-sessionizer"

bind-key -r D display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/Notes"
bind-key -r R display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/research"
bind-key -r W display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/work"
bind-key -r F display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/freelance"
bind-key -r P display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/personal"
bind-key -r S display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/technical-test"
bind-key -r T run-shell "~/.local/bin/tmux-sessionizer ~/.config/nvim"

bind-key -r a new-window -c "#{pane_current_path}" "source ~/development/backend-thing/python-proj/venv/bin/activate && exec $SHELL"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'

run '~/.tmux/plugins/tpm/tpm'
