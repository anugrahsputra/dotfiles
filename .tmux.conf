# ── Environment ─────────────────────────────────────
set-environment -g PATH "$HOME/.local/bin:$PATH"
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -s escape-time 0
set -g allow-passthrough on
set -g mouse on

# ── Prefix ──────────────────────────────────────────
unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix

# ── Base Theme (Koda Dark Flat) ─────────────────────
set -g status-style "bg=default,fg=#b0b0b0"

# ── Status Left ─────────────────────────────────────
set -g status-left-length 200
set -g status-left " #[fg=#ffffff,bold]⌘ #S #[fg=#50585d,nobold] "

# ── Status Right ────────────────────────────────────
set -g status-right-length 150
set -g status-right " #[fg=#b0b0b0] #(cd #{pane_current_path} 2>/dev/null && git branch --show-current 2>/dev/null) #[fg=#b0b0b0]#{?SSH_CONNECTION,SSH ,}#[fg=#50585d]%H:%M "

# ── Window Tabs ─────────────────────────────────────
set -g window-status-style "bg=#101010,fg=#474747"
set -g window-status-current-style "bg=#101010,fg=#ffffff,bold"

set -g window-status-format "  #I:#W  "
set -g window-status-current-format "  #I:#W  "

# ── Pane Borders ────────────────────────────────────
set -g pane-border-style "fg=#474747"
set -g pane-active-border-style "fg=#ffffff"

# ── Popup ───────────────────────────────────────────
set -g popup-border-style "fg=#ffffff"
set -g popup-style "bg=#101010"

# ── Message / Command Bar ───────────────────────────
set -g message-style "bg=#272727,fg=#ffffff"
set -g message-command-style "bg=#272727,fg=#ffffff"

# ── Status Bar Behavior ─────────────────────────────
set-option -g status-position top
set-option -g status-interval 5
set-option -g status-justify centre

# ── Shell ───────────────────────────────────────────
set-option -g default-shell /bin/zsh
set-option -g default-command /bin/zsh

# ── Reload ──────────────────────────────────────────
bind r source-file ~/.tmux.conf
set -g base-index 1

# ── Copy Mode (Vim Style) ───────────────────────────
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# ── Sessionizer Popups ──────────────────────────────
bind-key -r f display-popup -d "#{pane_current_path}" -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer"
bind-key -r D display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/Notes"
bind-key -r R display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/research"
bind-key -r W display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/work"
bind-key -r F display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/freelance"
bind-key -r P display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/personal"
bind-key -r S display-popup -E -w 70% -h 80% -x C -y C "~/.local/bin/tmux-sessionizer ~/Dev/technical-test"
bind-key -r T run-shell "~/.local/bin/tmux-sessionizer ~/.config/nvim"


bind-key -r g display-popup -d "#{pane_current_path}" -E -w 70% -h 80% -x C -y C "lazygit"
bind-key -r t display-popup -d "#{pane_current_path}" -E -w 70% -h 80% -x C -y C "zsh"

# ── Quick Python Env Window ─────────────────────────
bind-key -r a new-window -c "#{pane_current_path}" "source ~/development/backend-thing/python-proj/venv/bin/activate && exec $SHELL"

# ── Plugins ─────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'

run '~/.tmux/plugins/tpm/tpm'
